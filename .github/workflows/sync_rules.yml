name: Sync Rules

on:
  push:
    branches:
      - main
      - master
      - Surge
    paths:
      - '**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 2

      - name: Check commit message
        id: check_commit
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ $COMMIT_MSG == *"[AUTO_SYNC]"* || $COMMIT_MSG == *"[AUTO_FORMAT]"* ]]; then
            echo "Skipping workflow as this is an automated sync commit"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Proceeding with sync"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.check_commit.outputs.skip == 'false'
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install dependencies
        if: steps.check_commit.outputs.skip == 'false'
        run: |
          python -m pip install --upgrade pip

      - name: Configure Git
        if: steps.check_commit.outputs.skip == 'false'
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Create and run format script
        if: steps.check_commit.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: |
          cat > format_rules.py << 'EOF'
          #!/usr/bin/env python3
          import os, re, subprocess, ipaddress, logging, traceback
          from pathlib import Path
          from datetime import datetime, timedelta

          logging.basicConfig(level=logging.INFO, format="%(asctime)s - %(levelname)s - %(message)s")
          def get_china_time():
              return (datetime.utcnow() + timedelta(hours=8)).strftime('%Y-%m-%d %H:%M:%S')

          def process_rule_line(line, is_surge=True):
              line = line.strip()
              if not line or line.startswith("#"): return line
              known_prefixes = ["DOMAIN-SUFFIX,", "DOMAIN-KEYWORD,", "DOMAIN,", "IP-CIDR,", "IP-ASN,", "PROCESS-NAME,"]
              if any(line.startswith(prefix) for prefix in known_prefixes): return line
              if "." in line:
                  try:
                      parts = line.split('.')
                      if all(part.isdigit() for part in parts):
                          ipaddress.ip_address(line)
                          return f"IP-CIDR,{line}/32"
                      return f"DOMAIN-SUFFIX,{line}"
                  except: return f"DOMAIN-SUFFIX,{line}"
              return f"PROCESS-NAME,{line}"

          try:
              root_dir = Path(".")
              rule_files = [f for f in root_dir.glob('*') if f.is_file() and not f.name.startswith('.') and f.suffix not in ['.py', '.yml', '.yaml', '.md']]
              for rule_file in rule_files:
                  with open(rule_file, "r", encoding="utf-8") as f:
                      content = f.read()
                  current_time = get_china_time()
                  updated_lines = [f"# 最后更新时间: {current_time} (北京时间)"]
                  for line in content.splitlines():
                      if not line.startswith("# 最后更新时间:"):
                          updated_lines.append(process_rule_line(line))
                  updated_content = "\n".join(updated_lines)
                  if content != updated_content:
                      with open(rule_file, "w", encoding="utf-8") as f:
                          f.write(updated_content)
              
              subprocess.run(["git", "add", "."], check=True)
              if subprocess.run(["git", "status", "--porcelain"], capture_output=True, text=True).stdout.strip():
                  subprocess.run(["git", "commit", "-m", f"[AUTO_FORMAT] {get_china_time()}"], check=True)
                  subprocess.run(["git", "push"], check=True)
          except Exception as e:
              traceback.print_exc()
              exit(1)
          EOF
          python3 format_rules.py

      - name: Sync to Clash
        if: steps.check_commit.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: |
          cat > sync_to_clash.py << 'EOF'
          #!/usr/bin/env python3
          import os, subprocess, ipaddress, re
          from pathlib import Path
          from datetime import datetime, timedelta

          def get_china_time(): return (datetime.utcnow() + timedelta(hours=8)).strftime('%Y-%m-%d %H:%M:%S')
          
          github_token = os.environ.get("GITHUB_TOKEN", "")
          clash_repo = f"https://{github_token}@github.com/USNOCTURNE90/Clash.git"
          clash_dir = Path("Clash")
          if clash_dir.exists():
              import shutil
              shutil.rmtree(clash_dir)
          subprocess.run(["git", "clone", clash_repo, "Clash"], check=True)

          rule_files = [f for f in Path(".").glob('*') if f.is_file() and not f.name.startswith('.') and f.suffix not in ['.py', '.yml', '.yaml', '.md', '.txt'] and "Clash" not in str(f)]
          
          for surge_file in rule_files:
              with open(surge_file, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              clash_content = [f"# 最后更新时间: {get_china_time()} (北京时间)", "rules:"]
              for line in lines:
                  line = line.strip()
                  if line and not line.startswith("#"):
                      clash_content.append(f"  - {line}")
              with open(clash_dir / surge_file.name, "w", encoding="utf-8") as f:
                  f.write("\n".join(clash_content))

          subprocess.run(["git", "-C", "Clash", "add", "."], check=True)
          if subprocess.run(["git", "-C", "Clash", "status", "--porcelain"], capture_output=True, text=True).stdout.strip():
              subprocess.run(["git", "-C", "Clash", "commit", "-m", f"[AUTO_SYNC] {get_china_time()}"], check=True)
              subprocess.run(["git", "-C", "Clash", "push"], check=True)
          EOF
          python3 sync_to_clash.py

      - name: Sync to Sing-Box
        if: steps.check_commit.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: |
          cat > sync_to_singbox.py << 'EOF'
          #!/usr/bin/env python3
          import os, json, re, subprocess
          from pathlib import Path
          from datetime import datetime, timedelta

          def get_china_time(): return (datetime.utcnow() + timedelta(hours=8)).strftime('%Y-%m-%d %H:%M:%S')

          def parse_surge_to_singbox(lines):
              rules_dict = {"domain":[], "domain_suffix":[], "domain_keyword":[], "ip_cidr":[], "ip_asn":[], "process_name":[]}
              valid_prefixes = {"DOMAIN":"domain", "DOMAIN-SUFFIX":"domain_suffix", "DOMAIN-KEYWORD":"domain_keyword", "IP-CIDR":"ip_cidr", "IP-CIDR6":"ip_cidr", "IP-ASN":"ip_asn", "PROCESS-NAME":"process_name"}
              for line in lines:
                  line = line.strip()
                  if not line or line.startswith("#"): continue
                  matched = False
                  for prefix, key in valid_prefixes.items():
                      if line.upper().startswith(prefix + ","):
                          parts = line.split(',')
                          if len(parts) >= 2:
                              rules_dict[key].append(parts[1].strip())
                              matched = True
                          break
                  if not matched:
                      if re.match(r"^\d+\.\d+\.\d+\.\d+(/\d+)?$", line): rules_dict["ip_cidr"].append(line if "/" in line else f"{line}/32")
                      elif "." in line and not any(c in line for c in [":", "/", " "]): rules_dict["domain_suffix"].append(line)
              active_rules = {k: v for k, v in rules_dict.items() if v}
              return {"version": 1, "rules": [active_rules]} if active_rules else None

          github_token = os.environ.get("GITHUB_TOKEN", "")
          sb_repo_url = f"https://{github_token}@github.com/USNOCTURNE90/Sing-Box.git"
          sb_dir = Path("SingBoxRepo")
          if sb_dir.exists():
              import shutil
              shutil.rmtree(sb_dir)
          subprocess.run(["git", "clone", sb_repo_url, str(sb_dir)], check=True)

          for file in Path(".").glob('*'):
              if file.is_file() and not file.name.startswith('.') and file.suffix not in ['.py', '.yml', '.yaml', '.md'] and "Clash" not in str(file) and "SingBox" not in str(file):
                  with open(file, "r", encoding="utf-8") as f:
                      sb_data = parse_surge_to_singbox(f.readlines())
                  if sb_data:
                      with open(sb_dir / f"{file.name}.json", "w", encoding="utf-8") as f:
                          json.dump(sb_data, f, indent=2, ensure_ascii=False)

          subprocess.run(["git", "-C", str(sb_dir), "add", "."], check=True)
          if subprocess.run(["git", "-C", str(sb_dir), "status", "--porcelain"], capture_output=True, text=True).stdout.strip():
              subprocess.run(["git", "-C", str(sb_dir), "commit", "-m", f"[AUTO_SYNC] {get_china_time()}"], check=True)
              subprocess.run(["git", "-C", str(sb_dir), "push"], check=True)
          EOF
          python3 sync_to_singbox.py
