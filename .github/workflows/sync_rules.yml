name: Sync Rules

on:
  push:
    branches:
      - main
      - master
      - Surge
    paths:
      - '**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          token: ${{ secrets.PAT }}
          
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
      - name: Debug environment
        run: |
          echo "Current directory:"
          pwd
          echo "Directory contents:"
          ls -la
          
      - name: Run sync script
        run: |
          python -c '
          import os
          import re
          import time
          import subprocess
          from pathlib import Path
          import logging
          import traceback
          
          # 配置日志
          logging.basicConfig(
              level=logging.INFO,
              format="%(asctime)s - %(levelname)s - %(message)s"
          )
          logger = logging.getLogger(__name__)
          
          # 打印当前工作目录和内容
          print(f"Current directory: {os.getcwd()}")
          print(f"Directory contents: {list(Path('.').glob('*'))}")
          
          try:
              # 设置目录
              surge_dir = Path(".")
              clash_dir = Path("Clash")
              
              # 获取GitHub令牌
              github_token = os.environ.get("GITHUB_TOKEN", "")
              clash_repo = f"https://{github_token}@github.com/USNOCTURNE90/Clash-auto.git"
              
              # 清理并克隆Clash仓库
              if clash_dir.exists():
                  import shutil
                  shutil.rmtree(clash_dir)
              
              print(f"Cloning repo: {clash_repo}")
              subprocess.run(["git", "clone", clash_repo, "Clash"], check=True)
              
              # 查找规则文件
              rule_files = []
              for file_path in surge_dir.glob("*"):
                  if not file_path.is_file() or file_path.name.startswith("."):
                      continue
                  
                  try:
                      with open(file_path, "r", encoding="utf-8") as f:
                          content = f.read()
                          if "DOMAIN" in content or "IP-CIDR" in content:
                              rule_files.append(file_path)
                              print(f"Found rule file: {file_path.name}")
                  except Exception as e:
                      print(f"Error reading {file_path.name}: {str(e)}")
              
              if not rule_files:
                  print("No rule files found!")
                  print(f"All files: {list(surge_dir.glob('*'))}")
                  exit(1)
              
              # 处理规则文件
              for surge_file in rule_files:
                  with open(surge_file, "r", encoding="utf-8") as f:
                      surge_content = f.read()
                  
                  # 转换为Clash格式
                  clash_rules = ["rules:"]
                  for line in surge_content.split("\n"):
                      line = line.strip()
                      if not line or line.startswith("#"):
                          continue
                      
                      if any(line.startswith(prefix) for prefix in ["DOMAIN-SUFFIX,", "DOMAIN-KEYWORD,", "DOMAIN,", "IP-CIDR,", "IP-ASN,", "PROCESS-NAME,"]):
                          clash_rules.append(f"  - {line}")
                  
                  clash_content = "\n".join(clash_rules)
                  
                  # 写入Clash规则文件
                  clash_file = clash_dir / surge_file.name
                  with open(clash_file, "w", encoding="utf-8") as f:
                      f.write(clash_content)
                  
                  print(f"Synced rule file: {surge_file.name}")
              
              # 提交更改
              subprocess.run(["git", "-C", "Clash", "add", "."], check=True)
              
              # 检查是否有更改
              result = subprocess.run(
                  ["git", "-C", "Clash", "status", "--porcelain"],
                  capture_output=True,
                  text=True,
                  check=True
              )
              
              if result.stdout.strip():
                  print("Changes found, committing...")
                  commit_message = f"自动同步规则集 - {time.strftime('%Y-%m-%d %H:%M:%S')}"
                  subprocess.run(
                      ["git", "-C", "Clash", "commit", "-m", commit_message],
                      check=True
                  )
                  
                  print("Pushing changes...")
                  subprocess.run(["git", "-C", "Clash", "push"], check=True)
                  print("Successfully synced rules to Clash-auto repo")
              else:
                  print("No changes to commit")
          
          except Exception as e:
              print(f"Error: {str(e)}")
              traceback.print_exc()
              exit(1)
          '
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
