name: Clean Residue Folders

on: 
  workflow_dispatch: # 支持手动触发

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Force remove cached folders
        run: |
          # 强制从索引中移除这些“假”文件夹
          git rm -r --cached Clash_Repo || true
          git rm -r --cached Clash_Temp || true
          git rm -r --cached Clash_Tmp || true
          git rm -r --cached SB_Repo || true
          git rm -r --cached SingBox_Temp || true
          git rm -r --cached SingBoxRepo || true
          
          # 提交更改
          git commit -m "Cleanup: remove invalid submodule/directory references" || echo "No changes to commit"
          git push
