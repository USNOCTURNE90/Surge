name: Convert Surge Rules to Clash

on:
  push:
    paths:
      - 'rules/**/*.list'  # 触发条件：规则文件发生变化
  workflow_dispatch:  # 允许手动触发

jobs:
  convert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Surge repository
        uses: actions/checkout@v3
        with:
          path: surge-repo

      - name: Checkout Clash repository
        uses: actions/checkout@v3
        with:
          repository: USNOCTURNE90/clash-auto  # 替换成你的Clash仓库
          token: ${{ secrets.PAT }}  # 需要设置Personal Access Token
          path: clash-repo

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Convert Rules
        run: |
          python convert-rules.py
        env:
          SURGE_RULES_PATH: surge-repo/rules
          CLASH_RULES_PATH: clash-repo/rules

      - name: Commit and push changes
        run: |
          cd clash-repo
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add rules/
          git commit -m "chore: sync rules from surge repository" || echo "No changes to commit"
          git push origin main
