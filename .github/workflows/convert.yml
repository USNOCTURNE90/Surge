name: Convert and Push to Clash Repo

on:
  push:
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Clone and update target repository
        run: |
          git clone https://${{ secrets.PAT_TOKEN }}@github.com/usnocturne90/clash-auto.git
          python .github/scripts/convert.py
        env:
          TARGET_DIR: clash-auto

      - name: Push changes
        run: |
          cd clash-auto
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: update clash rules" || echo "No changes to commit"
          git push
