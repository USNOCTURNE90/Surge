name: Convert and Push to Clash Repo

on:
  push:
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          path: source-repo

      - name: Prepare target repository
        run: |
          mkdir -p clash-repo
          cd clash-repo
          git init .
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://${{ secrets.PAT_TOKEN }}@github.com/usnocturne90/clash-auto.git"
          git fetch origin
          if git ls-remote --heads origin main | grep main; then
            git pull origin main
          else
            echo "# Clash Rules" > README.md
            git add README.md
            git commit -m "Initial commit"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Convert Rules
        run: |
          python source-repo/.github/scripts/convert.py
        env:
          TARGET_DIR: clash-repo
          
      - name: Commit and Push Changes
        run: |
          cd clash-repo
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update clash rules"
            git push -u origin HEAD:main
          fi
