name: Convert and Push to Clash Repo

on:
  push:
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          path: source-repo

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: usnocturne90/clash-auto
          token: ${{ secrets.PAT_TOKEN }}
          path: clash-repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Convert Rules
        run: |
          python source-repo/.github/scripts/convert.py
        env:
          TARGET_DIR: clash-repo

      - name: Clean and Initialize Git
        run: |
          cd clash-repo
          rm -rf .git
          git init
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
      - name: Commit and Push Changes
        run: |
          cd clash-repo
          git add .
          git commit -m "chore: update clash rules"
          git branch -M main
          git remote add origin https://${{ secrets.PAT_TOKEN }}@github.com/usnocturne90/clash-auto.git
          git push -f origin main
