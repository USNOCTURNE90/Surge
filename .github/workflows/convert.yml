name: Convert and Push to Clash Repo

on:
  push:
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Clone and update target repository
        run: |
          git clone "https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/usnocturne90/clash-auto.git"
          python .github/scripts/convert.py
        env:
          TARGET_DIR: clash-auto

      - name: Push changes
        working-directory: clash-auto
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update clash rules"
            git push "https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/usnocturne90/clash-auto.git" main
          fi
