name: Convert and Push to Clash Repo

on:
  push:
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: usnocturne90/clash-auto
          token: ${{ secrets.PAT_TOKEN }}
          path: clash-auto
          ref: main
          persist-credentials: false

      - name: Convert Rules
        run: |
          python .github/scripts/convert.py
        env:
          TARGET_DIR: clash-auto

      - name: Deploy to clash-auto
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository-name: usnocturne90/clash-auto
          branch: main
          folder: clash-auto
          clean: true
