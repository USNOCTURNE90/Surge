name: Convert and Push to Clash Repo

on:
  push:
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          path: source-repo

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: usnocturne90/clash-auto  # 替换为你的目标仓库
          token: ${{ secrets.PAT_TOKEN }}
          path: clash-repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Convert Rules
        run: |
          python source-repo/.github/scripts/convert.py
        env:
          SOURCE_DIR: source-repo
          TARGET_DIR: clash-repo

      - name: Commit and Push Changes
        run: |
          cd clash-repo
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git diff --staged --quiet || (git commit -m "chore: update clash rules" && git push)
