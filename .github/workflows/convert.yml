name: Convert and Push to Clash Repo

on:
  push:
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: usnocturne90/clash-auto
          token: ${{ secrets.PAT_TOKEN }}
          path: clash-auto

      - name: Convert Rules
        run: |
          python .github/scripts/convert.py
        env:
          TARGET_DIR: clash-auto

      - name: Push changes
        working-directory: clash-auto
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update clash rules"
            git remote set-url origin https://${{ secrets.GITHUB_TOKEN }}@github.com/usnocturne90/clash-auto.git
            git push
          fi
