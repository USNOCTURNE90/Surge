name: Convert and Push to Clash Repo

on:
  push:
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          path: source-repo

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: usnocturne90/clash-auto
          token: ${{ secrets.PAT_TOKEN }}
          path: clash-repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Convert Rules
        run: |
          echo "=== Environment Info ==="
          python --version
          pip list
          echo "\n=== Directory Structure ==="
          ls -la
          ls -la source-repo/
          ls -la clash-repo/
          echo "\n=== Running Conversion ==="
          python source-repo/.github/scripts/convert.py
        env:
          TARGET_DIR: clash-repo
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push Changes
        run: |
          cd clash-repo
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git diff --staged --quiet || (git commit -m "chore: update clash rules" && git push)
