name: Convert and Push to Clash Repo

on:
  push:
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          path: source-repo

      - name: Create and prepare target directory
        run: |
          mkdir -p clash-repo
          cd clash-repo
          git init
          git remote add origin https://oauth2:${{ secrets.PAT_TOKEN }}@github.com/usnocturne90/clash-auto.git
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Convert Rules
        run: |
          python source-repo/.github/scripts/convert.py
        env:
          TARGET_DIR: clash-repo
          
      - name: Commit and Push Changes
        run: |
          cd clash-repo
          git add .
          git commit -m "chore: update clash rules"
          git branch -M main
          git push -f origin main
