name: Process Pending Deletions

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Process pending deletions
        env:
          TARGET_REPO: USNOCTURNE90/Clash
          TARGET_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: python .github/scripts/process_pending_deletions.py
