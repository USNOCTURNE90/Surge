name: Surge to Clash Ruleset Converter

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  convert-and-sync:
    runs-on: ubuntu-latest
    
    steps:
      # 检出 Surge 仓库
      - name: Checkout Surge Repository
        uses: actions/checkout@v4
        
      # 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      # 安装必要的依赖
      - name: Install Dependencies
        run: |
          npm install js-yaml
          
      # 转换规则并同步
      - name: Convert Surge to Clash and Sync
        env:
          TOKEN: ${{ secrets.TOKEN }}
          TARGET_REPO: USNOCTURNE90/clash-auto
        run: |
          # 创建临时目录
          mkdir -p converted-rules
          
          # 创建转换脚本
          cat << 'EOF' > convert.js
          const fs = require('fs');
          const yaml = require('js-yaml');
          
          // 支持的 Surge 规则类型
          const supportedRules = [
            'DOMAIN', 'DOMAIN-SUFFIX', 'DOMAIN-KEYWORD',
            'IP-CIDR', 'IP-CIDR6', 'GEOIP'
          ];
          
          // 读取 Surge 规则文件并转换（从根目录或 rules/ 目录）
          function convertRuleset(inputDirs, outputDir) {
            inputDirs.forEach(inputDir => {
              if (fs.existsSync(inputDir)) {
                fs.readdirSync(inputDir).forEach(file => {
                  if (fs.statSync(`${inputDir}/${file}`).isFile() && 
                      (file.endsWith('.txt') || file.endsWith('.list') || !file.includes('.'))) {
                    const content = fs.readFileSync(`${inputDir}/${file}`, 'utf8');
                    const lines = content.split('\n');
                    const clashRules = [];
                    const unsupportedRules = [];
                    
                    lines.forEach(line => {
                      const trimmed = line.trim();
                      if (!trimmed || trimmed.startsWith('#')) return;
                      
                      const [ruleType, ...rest] = trimmed.split(',');
                      const policy = rest.pop();
                      const value = rest.join(',').trim();
                      
                      if (supportedRules.includes(ruleType)) {
                        let clashRule = '';
                        switch(ruleType) {
                          case 'DOMAIN':
                            clashRule = `DOMAIN,${value}`;
                            break;
                          case 'DOMAIN-SUFFIX':
                            clashRule = `DOMAIN-SUFFIX,${value}`;
                            break;
                          case 'DOMAIN-KEYWORD':
                            clashRule = `DOMAIN-KEYWORD,${value}`;
                            break;
                          case 'IP-CIDR':
                            clashRule = `IP-CIDR,${value}`;
                            break;
                          case 'IP-CIDR6':
                            clashRule = `IP-CIDR6,${value}`;
                            break;
                          case 'GEOIP':
                            clashRule = `GEOIP,${value}`;
                            break;
                        }
                        clashRules.push(`${clashRule},${policy}`);
                      } else {
                        unsupportedRules.push(trimmed);
                      }
                    });
                    
                    const baseName = file.replace(/\.txt|\.list/, '');
                    if (clashRules.length > 0) {
                      fs.writeFileSync(
                        `${outputDir}/${baseName}.yaml`,
                        yaml.dump({ rules: clashRules })
                      );
                    }
                    
                    if (unsupportedRules.length > 0) {
                      fs.writeFileSync(
                        `${outputDir}/${baseName}_unsupported.txt`,
                        `# Unsupported rules from ${file}\n` + unsupportedRules.join('\n')
                      );
                    }
                  }
                });
              }
            });
          }
          
          // 执行转换（从根目录和 rules/ 目录读取）
          convertRuleset(['.', 'rules'], './converted-rules');
          EOF
          
          # 执行转换脚本
          node convert.js || exit 1
          
          # 配置 Git
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 克隆目标仓库，使用 TOKEN 认证
          git clone "https://x-access-token:$TOKEN@github.com/$TARGET_REPO.git" target-repo
          
          # 复制转换后的文件到目标仓库
          cp -r converted-rules/* target-repo/
          
          # 切换到目标仓库目录
          cd target-repo
          
          # 检查是否有更改
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # 提交更改并推送
          git commit -m "Auto-sync: Convert Surge rules to Clash format"
          git push origin main
          
      # 上传未支持规则作为 artifact
      - name: Upload Unsupported Rules
        uses: actions/upload-artifact@v3
        with:
          name: unsupported-rules
          path: converted-rules/*_unsupported.txt
