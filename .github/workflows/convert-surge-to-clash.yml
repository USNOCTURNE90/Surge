name: Surge to Clash Ruleset Converter

on:
  push:
    branches: [ main ]  # 每次推送到 main 分支时立即触发
  workflow_dispatch:  # 允许手动触发

jobs:
  convert-and-sync:
    runs-on: ubuntu-latest
    
    steps:
      # 检出 Surge 规则仓库
      - name: Checkout Surge Repository
        uses: actions/checkout@v4
        
      # 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      # 安装必要的依赖
      - name: Install Dependencies
        run: |
          npm install js-yaml
          
      # 转换规则并同步
      - name: Convert Surge to Clash and Sync
        env:
          TOKEN: ${{ secrets.TOKEN }}  # 推荐使用默认的 GITHUB_TOKEN 或自定义 PAT
          TARGET_REPO: USNOCTURNE90/clash-auto  # 替换为你的 clash-auto 仓库地址
        run: |
          # 创建临时目录
          mkdir -p converted-rules
          
          # 创建转换脚本
          cat << 'EOF' > convert.js
          const fs = require('fs');
          const yaml = require('js-yaml');
          
          // 支持的 Surge 规则类型
          const supportedRules = [
            'DOMAIN', 'DOMAIN-SUFFIX', 'DOMAIN-KEYWORD',
            'IP-CIDR', 'IP-CIDR6', 'GEOIP'
          ];
          
          // 读取 Surge 规则文件并转换
          function convertRuleset(inputDir, outputDir) {
            fs.readdirSync(inputDir).forEach(file => {
              // 匹配所有文本文件，包括没有后缀的或 .txt 后缀的文件
              if (fs.statSync(`${inputDir}/${file}`).isFile() && 
                  (file.endsWith('.txt') || !file.includes('.'))) {
                const content = fs.readFileSync(`${inputDir}/${file}`, 'utf8');
                const lines = content.split('\n');
                const clashRules = [];
                const unsupportedRules = [];
                
                lines.forEach(line => {
                  const trimmed = line.trim();
                  if (!trimmed || trimmed.startsWith('#')) return;
                  
                  const [ruleType, ...rest] = trimmed.split(',');
                  const policy = rest.pop();
                  const value = rest.join(',').trim();
                  
                  if (supportedRules.includes(ruleType)) {
                    // 转换为 Clash 格式
                    let clashRule = '';
                    switch(ruleType) {
                      case 'DOMAIN':
                        clashRule = `DOMAIN,${value}`;
                        break;
                      case 'DOMAIN-SUFFIX':
                        clashRule = `DOMAIN-SUFFIX,${value}`;
                        break;
                      case 'DOMAIN-KEYWORD':
                        clashRule = `DOMAIN-KEYWORD,${value}`;
                        break;
                      case 'IP-CIDR':
                        clashRule = `IP-CIDR,${value}`;
                        break;
                      case 'IP-CIDR6':
                        clashRule = `IP-CIDR6,${value}`;
                        break;
                      case 'GEOIP':
                        clashRule = `GEOIP,${value}`;
                        break;
                    }
                    clashRules.push(`${clashRule},${policy}`);
                  } else {
                    unsupportedRules.push(trimmed);
                  }
                });
                
                // 生成 Clash 规则文件（使用原始文件名去掉扩展名，如果有）
                const baseName = file.replace('.txt', '');
                if (clashRules.length > 0) {
                  fs.writeFileSync(
                    `${outputDir}/${baseName}.yaml`,
                    yaml.dump({ rules: clashRules })
                  );
                }
                
                // 记录不适用的规则
                if (unsupportedRules.length > 0) {
                  fs.writeFileSync(
                    `${outputDir}/${baseName}_unsupported.txt`,
                    `# Unsupported rules from ${file}\n` + unsupportedRules.join('\n')
                  );
                }
              }
            });
          }
          
          // 执行转换（从根目录读取）
          convertRuleset('.', './converted-rules');
          EOF
          
          # 执行转换脚本
          node convert.js
          
          # 配置 Git
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 克隆目标仓库，使用 TOKEN 认证
          git clone "https://x-access-token:$TOKEN@github.com/$TARGET_REPO.git" target-repo
          
          # 复制转换后的文件到目标仓库
          cp -r converted-rules/* target-repo/
          
          # 切换到目标仓库目录
          cd target-repo
          
          # 检查是否有更改
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # 提交更改并推送
          git commit -m "Auto-sync: Convert Surge rules to Clash format"
          git push origin main
          
      # 可选：上传未支持规则作为 artifact 以便检查
      - name: Upload Unsupported Rules
        uses: actions/upload-artifact@v3
        with:
          name: unsupported-rules
          path: converted-rules/*_unsupported.txt
