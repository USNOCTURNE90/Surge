name: Surge to Clash Ruleset Converter

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  convert-and-sync:
    runs-on: ubuntu-latest
    
    steps:
      # 检出 Surge 仓库
      - name: Checkout Surge Repository
        uses: actions/checkout@v4
        
      # 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      # 安装必要的依赖（包括 axios 用于 HTTP 请求）
      - name: Install Dependencies
        run: |
          npm install js-yaml axios
          
      # 转换规则并同步（直接从 URL 处理）
      - name: Convert Surge to Clash and Sync
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: USNOCTURNE90/clash-auto
          RULE_URL: https://example.com/surge-rules.txt  # 替换为实际 Surge 规则 URL
        run: |
          # 创建临时目录
          mkdir -p converted-rules
          
          # 创建转换脚本
          cat << 'EOF' > convert.js
          const axios = require('axios');
          const yaml = require('js-yaml');
          
          // 支持的 Surge 规则类型
          const supportedRules = [
            'DOMAIN', 'DOMAIN-SUFFIX', 'DOMAIN-KEYWORD',
            'IP-CIDR', 'IP-CIDR6', 'GEOIP'
          ];
          
          // 从 URL 读取并转换规则
          async function convertRuleset(ruleUrl) {
            try {
              const response = await axios.get(ruleUrl);
              const content = response.data;
              const lines = content.split('\n');
              const clashRules = [];
              const unsupportedRules = [];
              
              lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed || trimmed.startsWith('#')) return;
                
                const [ruleType, ...rest] = trimmed.split(',');
                const policy = rest.pop();
                const value = rest.join(',').trim();
                
                if (supportedRules.includes(ruleType)) {
                  let clashRule = '';
                  switch(ruleType) {
                    case 'DOMAIN':
                      clashRule = `DOMAIN,${value}`;
                      break;
                    case 'DOMAIN-SUFFIX':
                      clashRule = `DOMAIN-SUFFIX,${value}`;
                      break;
                    case 'DOMAIN-KEYWORD':
                      clashRule = `DOMAIN-KEYWORD,${value}`;
                      break;
                    case 'IP-CIDR':
                      clashRule = `IP-CIDR,${value}`;
                      break;
                    case 'IP-CIDR6':
                      clashRule = `IP-CIDR6,${value}`;
                      break;
                    case 'GEOIP':
                      clashRule = `GEOIP,${value}`;
                      break;
                  }
                  clashRules.push(`${clashRule},${policy}`);
                } else {
                  unsupportedRules.push(trimmed);
                }
              });
              
              // 生成 Clash 规则文件（使用默认文件名 rules.yaml）
              if (clashRules.length > 0) {
                fs.writeFileSync(
                  'converted-rules/rules.yaml',
                  yaml.dump({ rules: clashRules })
                );
              }
              
              // 记录不适用的规则
              if (unsupportedRules.length > 0) {
                fs.writeFileSync(
                  'converted-rules/unsupported.txt',
                  `# Unsupported rules from ${ruleUrl}\n` + unsupportedRules.join('\n')
                );
              }
            } catch (error) {
              console.error('Error fetching or processing rules:', error);
              throw error;
            }
          }
          
          // 执行转换（从环境变量中的 RULE_URL 读取）
          convertRuleset(process.env.RULE_URL);
          EOF
          
          # 执行转换脚本
          node convert.js || exit 1
          
          # 创建目标目录（如果不存在）
          mkdir -p converted-rules
          
          # 配置 Git
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 克隆目标仓库，使用 TOKEN 认证
          git clone "https://x-access-token:$TOKEN@github.com/$TARGET_REPO.git" target-repo
          
          # 复制转换后的文件到目标仓库
          cp -r converted-rules/* target-repo/
          
          # 切换到目标仓库目录
          cd target-repo
          
          # 检查是否有更改
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # 提交更改并推送
          git commit -m "Auto-sync: Convert Surge rules to Clash format"
          git push origin main
          
      # 上传未支持规则作为 artifact
      - name: Upload Unsupported Rules
        uses: actions/upload-artifact@v3
        with:
          name: unsupported-rules
          path: converted-rules/unsupported.txt
