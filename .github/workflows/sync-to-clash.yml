name: Sync Surge to Clash

on:
  push:
    branches:
      - Surge
    paths-ignore:
      - ".github/workflows/**"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: sync-surge-to-clash
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[AUTO_SYNC]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Surge repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Surge to Clash sync
        env:
          TARGET_REPO: USNOCTURNE90/Clash
          TARGET_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: python .github/scripts/sync_to_clash.py
